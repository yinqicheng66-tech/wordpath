services:
  db:
    image: postgres:16
    container_name: wordpath-db
    environment:
      POSTGRES_USER: wordpath
      POSTGRES_PASSWORD: wordpath
      POSTGRES_DB: wordpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordpath"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
